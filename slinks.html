<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังเปลี่ยนเส้นทาง... (MSTSC)</title>
    <link rel="icon" type="image/webp" href="/logo.webp">
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Anuphan', 'sans-serif'] }, colors: { mstPurple: '#4C1D95', mstYellow: '#FBBF24' } } } }
    </script>
    <style>
        body { background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 20px 40px rgba(76, 29, 149, 0.05); }
    </style>
</head>
<body class="flex h-screen items-center justify-center p-4">
    
    <div class="glass-card rounded-[2rem] p-10 max-w-sm w-full text-center relative overflow-hidden">
        <!-- สถานะกำลังโหลด -->
        <div id="loadingState" class="transition-opacity duration-300">
            <div class="relative w-20 h-20 mx-auto mb-6">
                <div class="absolute inset-0 border-4 border-gray-100 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-mstPurple rounded-full border-t-transparent animate-spin"></div>
                <!-- ใส่โลโก้โรงเรียนหมุนๆ ตรงกลาง -->
                <img src="/logo.webp" class="absolute inset-0 w-10 h-10 m-auto opacity-70 animate-pulse" alt="logo" onerror="this.style.display='none'">
            </div>
            <h2 class="text-xl font-black text-gray-800 mb-2">กำลังเชื่อมต่อข้อมูล...</h2>
            <p class="text-sm text-gray-500 font-medium">ระบบกำลังพาดำเนินการ กรุณารอสักครู่</p>
        </div>

        <!-- สถานะ Error (ซ่อนไว้เป็นค่าเริ่มต้น) -->
        <div id="errorState" class="hidden transition-opacity duration-300">
            <div class="w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6 shadow-inner">
                ❌
            </div>
            <h2 class="text-xl font-black text-gray-900 mb-2">ไม่พบลิงก์นี้ในระบบ</h2>
            <p class="text-sm text-gray-500 mb-8 font-medium" id="errorMessage">ลิงก์อาจถูกลบ หรือคุณพิมพ์ URL ไม่ถูกต้อง</p>
            <a href="/" class="block w-full bg-mstPurple text-white font-bold py-3.5 rounded-xl hover:bg-purple-900 transition shadow-md">
                กลับสู่หน้าหลัก
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAaZXkpLEjASJY4Dc-il8FmjDiZgTDhwkc",
            authDomain: "mstsc-official-portal.firebaseapp.com",
            projectId: "mstsc-official-portal"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function showError(message) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('errorState').classList.remove('hidden');
            if(message) document.getElementById('errorMessage').innerText = message;
        }

        async function processRedirect() {
            let linkId = "";

            // 1. ลองดึงรหัสลิงก์จาก Query String ก่อน (เช่น ?id=formlineoa)
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('id')) {
                linkId = urlParams.get('id');
            } 
            // 2. ถ้าไม่มี ให้ดึงจาก Path URL แทน (เช่น /slinks/formlineoa)
            else {
                const pathname = window.location.pathname;
                const pathParts = pathname.split('/').filter(Boolean);
                linkId = pathParts[pathParts.length - 1]; 
            }

            // ดักจับกรณีไม่มีข้อมูล หรือเป็นชื่อไฟล์
            if (!linkId || linkId === 'slinks' || linkId.includes('.html')) {
                showError('ไม่พบรหัสลิงก์ย่อ กรุณาตรวจสอบ URL ให้ถูกต้องอีกครั้ง');
                return;
            }
            
            linkId = linkId.toLowerCase(); 

            try {
                const docRef = doc(db, "official_links", linkId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    // หากพบลิงก์ ให้พาไป URL ปลายทาง
                    window.location.replace(docSnap.data().targetUrl);
                } else {
                    // หากฐานข้อมูลไม่มีลิงก์ชื่อนี้
                    showError(`ไม่พบลิงก์ "/${linkId}" ในระบบสภานักเรียน`);
                }
            } catch (error) {
                showError('เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล');
                console.error(error);
            }
        }

        // หน่วงเวลา 0.5 วิ ให้ผู้ใช้เห็น UI สวยๆ ก่อนย้ายหน้า
        setTimeout(processRedirect, 500);
    </script>
</body>
</html>
