<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังเปลี่ยนเส้นทาง...</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex h-screen items-center justify-center">
    <div class="text-center" id="statusBox">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-amber-400 border-t-purple-800 mx-auto mb-4"></div>
        <p class="text-gray-600 font-bold font-sans">กำลังนำคุณไปยังหน้าเว็บ...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAaZXkpLEjASJY4Dc-il8FmjDiZgTDhwkc",
            authDomain: "mstsc-official-portal.firebaseapp.com",
            projectId: "mstsc-official-portal"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function processRedirect() {
            // ดึงค่า URL (เช่น line) ออกมาจาก /slinks/line
            const pathname = window.location.pathname;
            const pathParts = pathname.split('/').filter(Boolean);
            let linkId = pathParts[pathParts.length - 1]; 

            if (!linkId || linkId === 'slinks' || linkId.includes('.html')) {
                document.getElementById('statusBox').innerHTML = '<p class="text-red-500 font-bold">❌ ไม่พบรหัสลิงก์ย่อ</p>';
                return;
            }
            
            linkId = linkId.toLowerCase(); 

            try {
                const docRef = doc(db, "official_links", linkId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    window.location.replace(docSnap.data().targetUrl);
                } else {
                    window.location.replace('/404.html');
                }
            } catch (error) {
                document.getElementById('statusBox').innerHTML = `<p class="text-red-500 font-bold">⚠️ ข้อผิดพลาด: ${error.message}</p>`;
            }
        }
        processRedirect();
    </script>
</body>
</html>
