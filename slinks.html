<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังเปลี่ยนเส้นทาง...</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex h-screen items-center justify-center">
    <div class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-amber-400 border-t-purple-800 mx-auto mb-4"></div>
        <p class="text-gray-600 font-bold font-sans">กำลังนำคุณไปยังหน้าเว็บ...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // คอนฟิก Firebase ชุดเดียวกับที่คุณใช้ใน admin.html
        const firebaseConfig = {
            apiKey: "AIzaSyAaZXkpLEjASJY4Dc-il8FmjDiZgTDhwkc",
            authDomain: "mstsc-official-portal.firebaseapp.com",
            projectId: "mstsc-official-portal"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function processRedirect() {
            // ดึงค่า id ออกมาจาก URL เช่น ?id=line
            const params = new URLSearchParams(window.location.search);
            const linkId = params.get('id');

            if (!linkId) {
                window.location.replace('/404.html');
                return;
            }

            try {
                // ค้นหาใน Collection ใหม่ที่ชื่อว่า "official_links" โดยให้ Document ID เป็นชื่อย่อลิงก์
                const docRef = doc(db, "official_links", linkId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    // ทำการย้ายหน้าไปยัง URL ปลายทาง
                    window.location.replace(data.targetUrl);
                } else {
                    // หากไม่เจอชื่อลิงก์นี้ ให้เด้งไปหน้า 404
                    window.location.replace('/404.html');
                }
            } catch (error) {
                console.error("Error fetching link:", error);
                window.location.replace('/404.html');
            }
        }

        processRedirect();
    </script>
</body>
</html>
