<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Results - e-Voting</title>
    <link rel="icon" type="image/webp" href="./logo.webp">
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Anuphan', 'sans-serif'] },
                    colors: {
                        mst: {
                            purple: '#581c87',
                            light: '#fdfbf7',
                            yellow: '#fef08a'
                        }
                    }
                } 
            } 
        }

        // ฟังก์ชันสำหรับเปิด-ปิดรูปภาพ (Image Lightbox)
        window.openImageModal = function(src) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modalImg.src = src;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalImg.classList.remove('scale-95');
                modalImg.classList.add('scale-100');
            }, 10);
        };

        window.closeImageModal = function() {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.classList.add('opacity-0');
            modalImg.classList.remove('scale-100');
            modalImg.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modalImg.src = '';
            }, 300);
        };
    </script>
    <style>
        body { 
            font-family: 'Anuphan', sans-serif; 
            background-color: #fdfbf7; 
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* Glassmorphism Classes */
        .glass-header { 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.6); 
            box-shadow: 0 4px 30px rgba(88, 28, 135, 0.05);
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.65); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.8); 
            box-shadow: 0 10px 30px rgba(88, 28, 135, 0.08); 
        }

        /* Animated Progress Bar */
        .bar-animate { transition: width 1.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        /* Hidden Scrollbar */
        ::-webkit-scrollbar { display: none; }

        /* Floating Background Orbs */
        .blob-purple { 
            position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; 
            background: #e9d5ff; border-radius: 50%; filter: blur(80px); z-index: -1; 
            animation: float 12s infinite alternate ease-in-out; 
        }
        .blob-yellow { 
            position: fixed; bottom: -10%; right: -10%; width: 40vw; height: 40vw; 
            background: #fef08a; border-radius: 50%; filter: blur(80px); z-index: -1; 
            animation: float 10s infinite alternate-reverse ease-in-out; 
            opacity: 0.7;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -50px) scale(1.1); }
        }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex flex-col h-screen text-gray-800">

    <!-- Background Orbs -->
    <div class="blob-purple"></div>
    <div class="blob-yellow"></div>

    <!-- Image Expansion Modal -->
    <div id="imageModal" class="fixed inset-0 z-[100] hidden bg-black/60 backdrop-blur-md flex items-center justify-center p-4 opacity-0 transition-opacity duration-300" onclick="closeImageModal()">
        <div class="relative max-w-4xl max-h-[90vh] flex flex-col items-center" onclick="event.stopPropagation()">
            <button onclick="closeImageModal()" class="absolute -top-14 right-0 text-white hover:text-yellow-300 p-2 transition-colors bg-white/10 rounded-full backdrop-blur-sm">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <img id="modalImage" src="" class="max-w-full max-h-[85vh] object-contain rounded-3xl shadow-2xl border-4 border-white/50 transform scale-95 transition-transform duration-300 bg-white">
        </div>
    </div>

    <!-- Header -->
    <header class="p-4 md:p-6 flex flex-col md:flex-row justify-between items-center glass-header z-10 shrink-0 gap-4">
        <div class="flex items-center gap-4">
            <img src="./logo.webp" class="w-12 h-12 md:w-16 md:h-16 bg-white rounded-full p-1 shadow-md object-cover">
            <div>
                <h1 class="text-2xl md:text-3xl font-black tracking-wide text-mst-purple uppercase">
                    Live Results
                </h1>
                <p class="text-purple-600 text-xs md:text-sm font-bold bg-purple-100 px-2 py-0.5 rounded-full inline-block mt-1">e-Voting</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3 w-full md:w-auto">
            <!-- ตัวเลือกแคมเปญ -->
            <div class="relative flex-1 md:w-80">
                <select id="campaignSelect" class="w-full bg-white/80 border border-purple-200 text-purple-900 text-sm md:text-lg rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 font-bold appearance-none cursor-pointer shadow-sm">
                    <option value="">กำลังโหลดรายการ...</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-purple-700">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>
            
            <a href="index.html" class="bg-white/80 hover:bg-purple-100 text-purple-700 p-3.5 rounded-2xl transition-colors border border-purple-200 shadow-sm shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 001 1m-6 0h6"></path></svg>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 relative">
        <div class="max-w-6xl mx-auto">
            
            <div class="text-center mb-8 md:mb-12 mt-4 md:mt-0 fade-in">
                <!-- หัวข้อการเลือกตั้ง -->
                <h2 id="displayTitle" class="text-3xl md:text-5xl font-extrabold mb-5 text-gray-900 flex flex-col md:flex-row items-center justify-center gap-3">
                    <div class="animate-spin rounded-full h-8 w-8 border-4 border-purple-200 border-t-purple-600"></div>
                </h2>
                
                <!-- ยอดผู้ใช้สิทธิ์รวม -->
                <div class="inline-flex items-center gap-3 bg-white/80 backdrop-blur-md px-6 py-3 rounded-full border border-purple-100 shadow-md">
                    <svg class="w-6 h-6 text-green-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="text-lg md:text-xl font-bold text-gray-700">ผู้ใช้สิทธิ์ทั้งหมด: <span id="totalVotesDisplay" class="text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600 text-2xl md:text-3xl font-black ml-1">0</span> คน</span>
                </div>
            </div>

            <!-- กล่องแสดงผลกราฟและอันดับ -->
            <div id="resultsContainer" class="space-y-4 md:space-y-6 pb-20">
                <!-- ข้อมูลจะถูก Render ผ่าน JS ตรงนี้ -->
            </div>

        </div>
    </main>

    <!-- Firebase Logic & Render -->
    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { collection, doc, getDocs, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        let unsubscribe = null;

        async function initialize() {
            try {
                await signInAnonymously(auth);
                await loadCampaigns();
            } catch (error) {
                console.error("Initialization Error:", error);
                document.getElementById("resultsContainer").innerHTML = `<div class="text-center text-red-500 text-xl font-bold mt-20 bg-red-50 p-6 rounded-3xl border border-red-200 shadow-sm max-w-md mx-auto">ไม่สามารถเชื่อมต่อระบบได้<br><span class="text-sm font-normal text-red-400 mt-2 block">กรุณาตรวจสอบอินเทอร์เน็ตและรีเฟรชหน้าเว็บ</span></div>`;
            }
        }

        async function loadCampaigns() {
            const select = document.getElementById('campaignSelect');
            
            try {
                const q = query(collection(db, "campaigns"), orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);
                
                select.innerHTML = '';
                
                if (snapshot.empty) {
                    select.innerHTML = '<option value="">ไม่มีรายการลงคะแนน</option>';
                    document.getElementById("displayTitle").innerHTML = "ยังไม่มีรายการลงคะแนน";
                    document.getElementById("resultsContainer").innerHTML = "";
                    return;
                }

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const option = document.createElement('option');
                    option.value = docSnap.id;
                    const statusText = data.status === "open" ? " (กำลังเปิด)" : " (ปิดระบบ)";
                    option.text = data.title + statusText;
                    select.appendChild(option);
                });

                if(select.options.length > 0) {
                    startLiveResults(select.value);
                }

                select.addEventListener('change', (e) => {
                    if(e.target.value) {
                        startLiveResults(e.target.value);
                    }
                });

            } catch (error) {
                console.error("Error loading campaigns:", error);
            }
        }

        function startLiveResults(campaignId) {
            if (unsubscribe) {
                unsubscribe();
            }

            const docRef = doc(db, "campaigns", campaignId);
            
            unsubscribe = onSnapshot(docRef, (docSnap) => {
                if (!docSnap.exists()) return;

                const data = docSnap.data();
                
                // SVG Status Indicator
                const isStatusOpen = data.status === "open";
                const statusIcon = isStatusOpen
                    ? `<svg class="w-8 h-8 md:w-10 md:h-10 text-green-500 animate-pulse drop-shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
                    : `<svg class="w-8 h-8 md:w-10 md:h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>`;
                    
                document.getElementById("displayTitle").innerHTML = `${statusIcon} <span>${data.title}</span>`;

                const options = data.options || [];
                const votes = data.votes_count || {};
                
                let results = [];
                let totalVotes = 0;

                options.forEach((opt, index) => {
                    const count = votes[opt.name] || 0;
                    totalVotes += count;
                    results.push({
                        candidateNumber: index + 1, 
                        name: opt.name,
                        image: opt.image,
                        count: count
                    });
                });

                if (votes["ไม่ประสงค์ลงคะแนน"] !== undefined) {
                    const noVoteCount = votes["ไม่ประสงค์ลงคะแนน"];
                    totalVotes += noVoteCount;
                    results.push({
                        name: "ไม่ประสงค์ลงคะแนน",
                        image: null,
                        isNoVote: true,
                        count: noVoteCount
                    });
                }

                document.getElementById("totalVotesDisplay").innerText = totalVotes.toLocaleString();

                results.sort((a, b) => b.count - a.count);
                renderResults(results, totalVotes);
            });
        }

        function renderResults(results, totalVotes) {
            const container = document.getElementById("resultsContainer");
            container.innerHTML = '';

            results.forEach((item, index) => {
                const percent = totalVotes === 0 ? 0 : ((item.count / totalVotes) * 100).toFixed(1);
                
                let rankBadge = '';
                let cardStyle = 'glass-card';
                let barColor = 'bg-gray-200';
                let textNameColor = 'text-gray-800';
                let textScoreColor = 'text-purple-700';

                if (!item.isNoVote) {
                    if (index === 0 && item.count > 0) {
                        // 1st Place - Gold & Premium
                        rankBadge = `<div class="absolute -left-3 -top-3 md:-left-4 md:-top-4 w-10 h-10 md:w-14 md:h-14 bg-gradient-to-br from-yellow-300 to-yellow-500 rounded-full flex items-center justify-center font-black text-xl md:text-3xl text-yellow-900 shadow-[0_4px_15px_rgba(250,204,21,0.5)] border-4 border-white z-20">1</div>`;
                        cardStyle = 'bg-white/90 backdrop-blur-xl border-2 border-yellow-400 shadow-[0_10px_30px_rgba(250,204,21,0.2)] transform scale-[1.02] md:scale-[1.03] z-10';
                        barColor = 'bg-gradient-to-r from-yellow-400 to-yellow-300 shadow-[0_0_10px_rgba(250,204,21,0.6)]';
                        textNameColor = 'text-gray-900 font-extrabold';
                        textScoreColor = 'text-transparent bg-clip-text bg-gradient-to-r from-yellow-600 to-yellow-500';
                    } else if (index === 1 && item.count > 0) {
                        // 2nd Place - Silver
                        rankBadge = `<div class="absolute -left-2 -top-2 md:-left-3 md:-top-3 w-8 h-8 md:w-10 md:h-10 bg-gradient-to-br from-gray-200 to-gray-400 rounded-full flex items-center justify-center font-black text-lg md:text-xl text-gray-800 shadow-md border-2 border-white z-20">2</div>`;
                        barColor = 'bg-gradient-to-r from-gray-400 to-gray-300';
                        textNameColor = 'text-gray-800 font-bold';
                    } else if (index === 2 && item.count > 0) {
                        // 3rd Place - Bronze
                        rankBadge = `<div class="absolute -left-2 -top-2 md:-left-3 md:-top-3 w-8 h-8 md:w-10 md:h-10 bg-gradient-to-br from-orange-300 to-orange-500 rounded-full flex items-center justify-center font-black text-lg md:text-xl text-orange-950 shadow-md border-2 border-white z-20">3</div>`;
                        barColor = 'bg-gradient-to-r from-orange-400 to-orange-300';
                        textNameColor = 'text-gray-800 font-bold';
                    } else {
                        // Regular Place
                        barColor = 'bg-gradient-to-r from-purple-500 to-purple-400';
                    }
                } else {
                    // No Vote
                    barColor = 'bg-gradient-to-r from-red-500 to-red-400';
                    textNameColor = 'text-red-500 font-bold';
                    textScoreColor = 'text-red-600';
                }

                // Avatar / Image / Number Fallback
                let avatarHtml = '';
                if (item.isNoVote) {
                    avatarHtml = `<div class="w-16 h-16 md:w-24 md:h-24 shrink-0 rounded-full bg-red-50 border-4 border-white flex items-center justify-center text-red-500 shadow-md"><svg class="w-8 h-8 md:w-12 md:h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg></div>`;
                } else if (item.image) {
                    avatarHtml = `
                        <div class="relative cursor-pointer group shrink-0" onclick="openImageModal('${item.image}')" title="คลิกเพื่อดูรูปขยาย">
                            <img src="${item.image}" class="w-16 h-16 md:w-24 md:h-24 rounded-full object-cover border-4 border-white bg-gray-50 shadow-md transition-transform duration-300 group-hover:scale-105">
                            <div class="absolute inset-0 bg-purple-900/40 rounded-full opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity duration-300">
                                <svg class="w-6 h-6 md:w-8 md:h-8 text-white drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                            </div>
                        </div>`;
                } else {
                    avatarHtml = `<div class="w-16 h-16 md:w-24 md:h-24 shrink-0 rounded-full bg-purple-100 border-4 border-white flex items-center justify-center font-black text-2xl md:text-4xl text-purple-700 shadow-md">${item.candidateNumber}</div>`;
                }

                const html = `
                    <div class="${cardStyle} p-4 md:p-6 rounded-3xl relative transition-all duration-500 flex items-center gap-4 md:gap-6 fade-in" style="animation-delay: ${index * 0.05}s">
                        ${rankBadge}
                        ${avatarHtml}
                        
                        <div class="flex-1 min-w-0 py-1">
                            <div class="flex justify-between items-end mb-2 md:mb-3">
                                <h3 class="text-lg md:text-2xl truncate pr-2 ${textNameColor}">${item.name}</h3>
                                <div class="text-right shrink-0">
                                    <div class="text-2xl md:text-4xl font-black tracking-tight ${textScoreColor}">${item.count.toLocaleString()}</div>
                                </div>
                            </div>
                            
                            <div class="flex items-center gap-3">
                                <div class="w-full bg-gray-200/50 rounded-full h-3 md:h-4 overflow-hidden border border-white/60 shadow-inner">
                                    <div class="${barColor} h-full rounded-full bar-animate" style="width: ${percent}%"></div>
                                </div>
                                <div class="text-sm md:text-base font-extrabold ${textScoreColor} w-16 text-right shrink-0">${percent}%</div>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        window.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
